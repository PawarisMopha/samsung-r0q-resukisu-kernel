name: Build and Upload Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev coreutils sed grep findutils

      - name: Clone Full Kernel Source Tree
        uses: actions/checkout@v4
        with:
          repository: 'tcburakdemir/samsung-r0q-resukisu-kernel'
          depth: 1
          submodules: false

      - name: Fix and Update Submodules Manually
        run: |
          git config --global --unset-all submodule.kernel_platform/common/Baseband-guard.url || true
          git config --local --unset-all submodule.kernel_platform/common/Baseband-guard.url || true
          git rm --cached kernel_platform/common/Baseband-guard || true
          rm -rf kernel_platform/common/Baseband-guard || true
          if [ -f .gitmodules ]; then
            git submodule init
            git submodule update --init --recursive || true
          fi

      - name: Inject Safe System Path
        run: |
          echo "PATH=/usr/lib/ccache:/usr/bin:/bin:/usr/sbin:/sbin:$PATH" >> $GITHUB_ENV

      - name: Bypass Samsung Path Overwrite
        run: |
          # สร้างโฟลเดอร์เครื่องมือจำลองไว้ในจุดที่สคริปต์ซัมซุงเรียกใช้ (host_tools)
          mkdir -p out/msm-kernel/host_tools
          
          # ลิงก์คำสั่งพื้นฐานทั้งหมดของ Ubuntu เข้าไปในโฟลเดอร์นั้นโดยตรงเพื่อไม่ให้มันหาไม่เจอ
          ln -sf /usr/bin/nproc out/msm-kernel/host_tools/nproc
          ln -sf /usr/bin/readlink out/msm-kernel/host_tools/readlink
          ln -sf /bin/sed out/msm-kernel/host_tools/sed
          ln -sf /usr/bin/tr out/msm-kernel/host_tools/tr
          ln -sf /bin/grep out/msm-kernel/host_tools/grep
          ln -sf /bin/awk out/msm-kernel/host_tools/awk

      - name: Run Samsung Kernel Build Script
        run: |
          export PATH="/usr/lib/ccache:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          chmod +x build_kernel_GKI.sh
          ./build_kernel_GKI.sh

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-S22-Resukisu-Kernel
          path: |
            out/arch/arm64/boot/Image
            out/*.zip
          if-no-files-found: warn

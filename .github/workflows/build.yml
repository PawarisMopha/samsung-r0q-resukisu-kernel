name: Build Samsung S22 Kernel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. ดึงซอร์สโค้ดจากคลังข้อมูลของคุณ (รวมถึงไฟล์ Clang ที่อยู่ใน repo ด้วย)
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      # 2. ติดตั้งเครื่องมือพื้นฐานที่จำเป็นในการคอมไพล์
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev lld llvm crossbuild-essential-arm64

      # 3. เริ่มคอมไพล์ Kernel โดยชี้พาธไปที่ Clang ในตัวซอร์สโค้ด
      - name: Build Kernel
        run: |
          # 1. ติดตั้งเครื่องมือบิวด์ให้ครบถ้วนเผื่อไว้ก่อน
          sudo apt-get update
          sudo apt-get install -y coreutils sed grep gawk findutils

          # 2. ตั้งค่าพาธของเครื่องบิวด์ให้ชี้ไปยัง Toolchain ใน Repo ของคุณ
          export CLANG_DIR="$GITHUB_WORKSPACE/samsung-r0q-resukisu-kernel/kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b"
          if [ ! -d "$CLANG_DIR" ]; then
            export CLANG_DIR="$GITHUB_WORKSPACE/kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b"
          fi
          
          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export CXX=clang++

          # 3. [จุดสำคัญ] บังคับให้สคริปต์มองเห็นคำสั่งพื้นฐานของ Linux 
          # โดยการส่ง PATH พื้นฐานพ่วงเข้าไปในสคริปต์ตอนรันด้วย
          if [ -f "build_kernel_GKI.sh" ]; then
            chmod +x build_kernel_GKI.sh
            PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH" ./build_kernel_GKI.sh
          elif [ -f "kernel_platform/build_kernel_GKI.sh" ]; then
            cd kernel_platform
            chmod +x build_kernel_GKI.sh
            PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH" ./build_kernel_GKI.sh
          else
            echo "Error: build_kernel_GKI.sh not found!"
            exit 1
          fi

      # 4. เก็บไฟล์ผลลัพธ์ที่ได้จากการบิวด์
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-S22-Kernel
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img

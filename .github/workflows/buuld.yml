name: Build Samsung Kernel GKI

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          
      - name: Clone Full Kernel Source Tree
        run: |
          git clone --depth=1 https://github.com/tcburakdemir/samsung-r0q-resukisu-kernel.git .

      - name: Inject Safe System Path
        run: |
          echo "/usr/bin" >> $GITHUB_PATH
          echo "/bin" >> $GITHUB_PATH
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Run Samsung Kernel Build Script
        env:
          PATH: /usr/bin:/bin:/usr/local/bin:/usr/sbin:/sbin
        run: |
          sed -i '2i export PATH="$PATH:/usr/bin:/bin:/usr/local/bin"' build_kernel_GKI.sh
          chmod +x build_kernel_GKI.sh
          ./build_kernel_GKI.sh
